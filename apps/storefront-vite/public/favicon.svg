<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E132D" />
      <stop offset="50%" stop-color="#11141A" />
      <stop offset="100%" stop-color="#0B0D12" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD2" />
      <stop offset="35%" stop-color="#E5C386" />
      <stop offset="70%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9C7F52" />
    </linearGradient>
  </defs>

  <!-- Luxury rounded tile -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  
  <!-- Subtle gold frame -->
  <rect x="7" y="7" width="114" height="114" rx="21" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.5" />

  <!-- Center Monogram "i" in luxury serif -->
  <text 
    x="64" 
    y="84" 
    font-family="'Playfair Display', Didot, Georgia, 'Times New Roman', serif" 
    font-size="76" 
    font-weight="700" 
    font-style="italic"
    fill="url(#goldGrad)" 
    text-anchor="middle"
  >i</text>

  <!-- Subtitle for larger rendering -->
  <text 
    x="64" 
    y="108" 
    font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" 
    font-size="9.5" 
    font-weight="700" 
    letter-spacing="0.32em" 
    fill="#E5C386" 
    text-anchor="middle"
    opacity="0.9"
  >IFẸ́MI</text>
</svg>